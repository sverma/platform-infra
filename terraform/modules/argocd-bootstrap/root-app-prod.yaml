apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: root-app-prod
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/sverma/platform-infra.git
    targetRevision: main
    path: gitops/apps/prod
  destination:
    server: https://34.93.253.26
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true