apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: root-app-platform-stage
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/sverma/platform-infra.git
    targetRevision: main
    path: gitops/platform/overlays/stage

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true