apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: external-dns
  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://kubernetes-sigs.github.io/external-dns

    chart: external-dns

    targetRevision: 1.15.0

    helm:
      values: |

        provider: google

        policy: sync

        serviceAccount:
          create: true
          name: external-dns

        sources:
          - gateway-httproute
          - gateway-grpcroute
          - gateway-tlsroute
          - gateway-tcproute
          - gateway-udproute

        domainFilters:
          - challan.pro

  syncPolicy:
    automated:
      selfHeal: true
      prune: true

    syncOptions:
      - CreateNamespace=true
