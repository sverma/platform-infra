apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: observability-crds-prod
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/prometheus-operator/prometheus-operator
    targetRevision: v0.86.1
    path: example/prometheus-operator-crd

  destination:
    server: https://34.93.253.26
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true

