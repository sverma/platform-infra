apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gateways
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/sverma/platform-infra.git
    targetRevision: main
    path: gitops/platform/overlays/prod/gateways

  destination:
    server: https://34.93.253.26
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
