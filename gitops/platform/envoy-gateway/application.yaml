apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:

  project: default

  source:

    repoURL: oci://docker.io/envoyproxy/gateway-helm

    chart: gateway-helm

    targetRevision: v1.8.0

    helm:
      values: |

        deployment:
          replicas: 2

        service:
          type: ClusterIP

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      selfHeal: true
      prune: true

    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
